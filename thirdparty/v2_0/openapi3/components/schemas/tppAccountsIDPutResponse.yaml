title: AccountsIDPutResponse
type: object
description: >-
  Callback and data model information for GET /tppAccounts/{accountRequestId}/{SignedChallenge}:

  Callback - PUT /tppAccounts/{accountRequestId}
  Error Callback - PUT /tppAccounts/{accountRequestId}/error
  Data Model - accountList

  The PUT /tppAccounts/{accountRequestId} response is used to inform the requester of the result
  of a request for accounts information. The accountRequestId given in the call
  is the value given in the original request.

  https://github.com/mojaloop/documentation/blob/main/website/versioned_docs/v2.0.0/api/thirdparty/data-models.md#31121--put-accountsid
properties:
  accountList:
    $ref: ./AccountList.yaml
  extensionList:
    $ref: ./ExtensionList.yaml
required:
  - accountList
