scan-type: source
disabled: false
ignore:
  - vulnerability: GHSA-58qx-3vcg-4xpx
    package:
      name: ws (WebSocket)
      version: 8.18.3
    reason: ' Uninitialized memory disclosure'
  - vulnerability: GHSA-8r5x-fm3f-whwj
    include-aliases: true
    reason: 'Unfixable npm transitive vulnerability: handlebars (critical severity) as of 2026-10-16'
  - vulnerability: GHSA-p8wg-vrv2-v86f
    include-aliases: true
    reason: 'Unfixable npm transitive vulnerability: handlebars (critical severity) as of 2026-10-16'
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    include-aliases: true
    reason: 'Unfixable npm transitive vulnerability: braces (high severity) as of 2026-10-16'
  - vulnerability: GHSA-xw65-4hp5-5hc7
    include-aliases: true
    reason: 'Unfixable npm transitive vulnerability: handlebars (moderate severity) as of 2026-10-16'
output:
  - table
  - json
quiet: false
check-for-app-update: false
only-fixed: false
add-cpes-if-none: false
by-cve: false
db:
  auto-update: true
  validate-age: true
  max-allowed-built-age: 120h
